[project]
name = "hamburg-whereabouts-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.3",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
